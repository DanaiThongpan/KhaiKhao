{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>แผนที่ยอดขาย (Heatmap) - KhaiKhao POS</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Heatmap Plugin -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <style>
        html, body { max-width: 100vw; overflow-x: hidden; font-family: 'Sarabun', sans-serif; background: #f8fafc; margin: 0; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        .app { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; flex-shrink: 0; background: #111827; color: white; display: flex; flex-direction: column; }
        .main { flex: 1; display: flex; flex-direction: column; }

        .page-header { margin: 25px 30px; padding-bottom: 15px; border-bottom: 2px dashed #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;}
        .page-header h1 { margin: 0; font-size: 28px; color: #0f172a; }
        .page-header p { margin: 8px 0 0; color: #64748b; font-size: 15px; }

        .filter-group { display: flex; gap: 10px; background: white; padding: 6px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .filter-btn { padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: bold; color: #475569; text-decoration: none; transition: 0.2s; }
        .filter-btn:hover { background: #f1f5f9; }
        .filter-btn.active { background: #ef4444; color: white; box-shadow: 0 2px 5px rgba(239, 68, 68, 0.3); }

        .map-wrapper { flex: 1; margin: 0 30px 30px 30px; position: relative; border-radius: 20px; overflow: hidden; border: 4px solid white; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); min-height: 500px;}
        #map { width: 100%; height: 100%; z-index: 1; }

        /* การ์ดสรุปยอดขายบนแผนที่ */
        .summary-card { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 20px; border-radius: 16px; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.5); width: 320px; max-height: calc(100% - 40px); display: flex; flex-direction: column; }
        .summary-title { font-weight: 800; color: #1e293b; font-size: 16px; margin-bottom: 10px; border-bottom: 2px dashed #cbd5e1; padding-bottom: 10px; flex-shrink: 0;}

        /* เพิ่มระบบ Scrollbar ให้ตารางดูหอพักได้ทั้งหมด */
        .top-list { padding: 0; margin: 0; list-style: none; overflow-y: auto; padding-right: 5px; flex: 1; }
        .top-list::-webkit-scrollbar { width: 4px; }
        .top-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .top-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #475569;}
        .top-list li:last-child { border-bottom: none; }

        /* ป้ายบอกจำนวนบิลแบบเปลี่ยนสีได้ */
        .count-badge { padding: 4px 8px; border-radius: 8px; font-weight: bold; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }

        @media (max-width: 850px) {
            body { padding-bottom: 80px !important; }
            .app { flex-direction: column !important; }

            .sidebar { position: fixed !important; bottom: 0 !important; top: auto !important; left: 0 !important; right: 0 !important; width: 100% !important; height: 70px !important; flex-direction: row !important; background: #111827 !important; padding: 0 !important; justify-content: space-around !important; z-index: 9999 !important; }
            .sidebar .logo { display: none !important; }
            .sidebar .menu { display: flex !important; flex-direction: row !important; width: 100% !important; justify-content: space-around !important; padding: 0 !important; margin: 0 !important; }
            .sidebar .menu-item { display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; padding: 5px !important; width: 100% !important; font-size: 11px !important; }
            .sidebar .menu-item span:nth-child(1) { font-size: 24px !important; margin-bottom: 4px !important; }
            .sidebar .menu-item span:nth-child(2) { display: block !important; font-size: 11px !important; }

            .page-header { margin: 15px; padding-bottom: 15px; flex-direction: column; align-items: flex-start;}
            .filter-group { width: 100%; overflow-x: auto; flex-wrap: nowrap; justify-content: flex-start;}
            .filter-btn { white-space: nowrap; }

            .map-wrapper { margin: 0 15px 15px 15px; height: auto; display: flex; flex-direction: column; }
            #map { height: 45vh; min-height: 350px; flex: none; border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: none; }

            .summary-card { position: relative; top: 0; right: 0; width: 100%; max-height: 40vh; border-radius: 0 0 20px 20px; border: 4px solid white; border-top: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        }
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo"><h2>KhaiKhao</h2><span>POS</span></div>
        <nav class="menu">
            <a href="{% url 'pos:home' %}" class="menu-item"><span>🏠</span><span>หน้าหลัก</span></a>
            <a href="{% url 'riders:home' %}" class="menu-item"><span>🛵</span><span>ติดตามไรเดอร์</span></a>
            <a href="{% url 'heatmap:home' %}" class="menu-item active"><span>🔥</span><span>แผนที่ยอดขาย</span></a>
        </nav>
    </aside>

    <main class="main">
        <header class="page-header">
            <div>
                <h1>🔥 แผนที่ความร้อนยอดขาย (Heatmap)</h1>
                <p>วิเคราะห์โซนขายดี และหอพักที่มีการสั่งออเดอร์หนาแน่นที่สุด</p>
            </div>

            <!-- ตัวกรองช่วงเวลา -->
            <div class="filter-group">
                <a href="?filter=daily" class="filter-btn {% if filter_type == 'daily' %}active{% endif %}">รายวัน</a>
                <a href="?filter=weekly" class="filter-btn {% if filter_type == 'weekly' %}active{% endif %}">สัปดาห์นี้</a>
                <a href="?filter=monthly" class="filter-btn {% if filter_type == 'monthly' %}active{% endif %}">เดือนนี้</a>
                <a href="?filter=yearly" class="filter-btn {% if filter_type == 'yearly' %}active{% endif %}">ปีนี้</a>
            </div>
        </header>

        <div class="map-wrapper">
            <div id="map"></div>

            <div class="summary-card">
                <div class="summary-title">🏆 สถิติยอดสั่งซื้อทุกหอพัก</div>
                <ul class="top-list" id="topDormsList">
                    <!-- Javascript จะดึงข้อมูลมาใส่ตรงนี้ -->
                </ul>
            </div>
        </div>
    </main>
</div>

<script>
    let rawData = {{ heatmap_data_json|safe }};

    document.addEventListener("DOMContentLoaded", function() {
        // 1. สร้างแผนที่
        let map = L.map('map', { zoomControl: false }).setView([15.1218, 104.9038], 14);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // 2. เตรียมข้อมูลทำ Heatmap
        let heatPoints = [];
        let maxCount = 0;

        rawData.forEach(d => {
            if (d.count > maxCount) maxCount = d.count;
        });

        rawData.forEach(d => {
            let intensity = maxCount > 0 ? (d.count / maxCount) * 1.5 : 0.5;
            heatPoints.push([d.lat, d.lng, intensity]);

            let circle = L.circleMarker([d.lat, d.lng], {
                radius: 6 + (d.count * 1.2),
                fillColor: "#ef4444",
                color: "#b91c1c",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.2
            }).addTo(map);

            circle.bindPopup(`
                <div style="text-align: center;">
                    <b style="font-size: 15px;">${d.name}</b><br>
                    <span style="color: #64748b; font-size: 12px;">โซน: ${d.zone || '-'}</span><br>
                    <div style="font-size: 20px; font-weight: bold; color: #ef4444; margin-top: 5px;">🔥 ${d.count} ออเดอร์</div>
                </div>
            `);
        });

        // 3. วาด Heatmap Layer
        let heat = L.heatLayer(heatPoints, {
            radius: 35,
            blur: 25,
            maxZoom: 16,
            gradient: {0.2: 'blue', 0.4: 'cyan', 0.6: 'lime', 0.8: 'yellow', 1.0: 'red'}
        }).addTo(map);

        // 4. อัปเดตตารางให้โชว์ทุกหอพัก และไล่สีตามยอด (Color Gradient)
        let topListHtml = "";
        // เรียงลำดับจากยอดเยอะสุดไปน้อยสุด โดยไม่จำกัดแค่ 5 อันดับแล้ว
        let sortedData = [...rawData].sort((a, b) => b.count - a.count);

        if (sortedData.length === 0) {
            topListHtml = "<li style='text-align: center; color: #9ca3af; justify-content: center;'>ยังไม่มีข้อมูลในช่วงเวลานี้</li>";
        } else {
            sortedData.forEach((d, index) => {
                // ทำเหรียญรางวัลให้ 3 อันดับแรก ที่เหลือเป็นตัวเลขธรรมดา
                let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `<span style="display:inline-block; width: 22px; text-align:center; color:#94a3b8; font-size:12px;">${index+1}.</span>`;

                // คำนวณความร้อนแรงเพื่อไล่ระดับสีป้ายกำกับ
                let ratio = maxCount > 0 ? d.count / maxCount : 0;
                let bg, color, icon;

                if (ratio >= 0.8) {
                    bg = '#fee2e2'; color = '#dc2626'; icon = '🔥'; // สีแดง (ยอดสูงสุด)
                } else if (ratio >= 0.5) {
                    bg = '#ffedd5'; color = '#ea580c'; icon = '📈'; // สีส้ม (ยอดปานกลาง)
                } else if (ratio >= 0.2) {
                    bg = '#fef9c3'; color = '#ca8a04'; icon = '⭐'; // สีเหลือง (ยอดทั่วไป)
                } else {
                    bg = '#f1f5f9'; color = '#64748b'; icon = '🔹'; // สีเทา (ยอดน้อยสุด)
                }

                topListHtml += `
                    <li>
                        <span style="font-weight: 500;">${medal} ${d.name}</span>
                        <span class="count-badge" style="background: ${bg}; color: ${color};">
                            ${icon} ${d.count} บิล
                        </span>
                    </li>
                `;
            });
        }
        document.getElementById('topDormsList').innerHTML = topListHtml;
    });
</script>
</body>
</html>
