{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Monitor - KhaiKhao Center</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; overflow-x: hidden; }
        * { box-sizing: border-box; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #334155; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { margin: 0; color: #38bdf8; display: flex; align-items: center; gap: 10px; font-size: 22px; }
        .blinking-dot { width: 10px; height: 10px; background-color: #ef4444; border-radius: 50%; display: inline-block; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; box-shadow: 0 0 10px #ef4444; } 50% { opacity: 0.3; box-shadow: none; } 100% { opacity: 1; box-shadow: 0 0 10px #ef4444; } }

        .btn-back { background: #334155; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-back:hover { background: #475569; }

        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #1e293b; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .stat-card h3 { margin: 0 0 5px 0; font-size: 13px; color: #94a3b8; }
        .stat-card .num { font-size: 30px; font-weight: 900; line-height: 1; margin: 5px 0; }
        .c-pending .num { color: #f59e0b; }
        .c-delivering .num { color: #3b82f6; }
        .c-completed .num { color: #10b981; }

        .boards-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; align-items: start; }
        .board-container { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 20px; min-height: 400px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);}
        
        .board-title { margin: 0 0 15px 0; font-size: 16px; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        .title-orange { color: #f59e0b; font-weight: 800; }
        .title-blue { color: #3b82f6; font-weight: 800; }
        .title-green { color: #10b981; font-weight: 800; }
        
        .shop-group { background: #162032; border: 1px solid #334155; border-radius: 10px; margin-bottom: 15px; padding: 15px; }
        .shop-group-title { margin: 0 0 12px 0; color: #e2e8f0; font-size: 15px; border-bottom: 1px dashed #334155; padding-bottom: 8px; display: flex; align-items: center; gap: 8px;}
        
        .order-list { display: flex; flex-direction: column; gap: 10px; }
        .order-card { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; transition: 0.3s; }
        .order-card:hover { border-color: #475569; background: #111827; }
        
        .order-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;}
        .order-receipt { font-weight: bold; color: #cbd5e1; font-size: 14px; }
        
        .live-timer { font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 6px; border: 1px solid transparent; background: #1e293b; color: #94a3b8; }
        .order-dest { color: #94a3b8; font-size: 13px; margin-bottom: 6px;}
        .order-items-box { background: #1e293b; padding: 8px 12px; border-radius: 8px; font-size: 12px; color: #e2e8f0; border: 1px dashed #475569; }
        .order-items-box ul { margin: 0; padding-left: 15px; }
        .order-items-box li { margin-bottom: 3px; }
        .order-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: #64748b;}
        
        /* กราฟแท่งสถิติไรเดอร์ */
        .rider-stat-box { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 15px; margin-bottom: 12px; }
        .progress-stacked { display: flex; height: 16px; overflow: hidden; border-radius: 6px; background: #334155; margin-bottom: 15px; }
        .progress-green { background: #10b981; display:flex; justify-content:center; align-items:center; font-size:10px; color:white; font-weight:bold; white-space:nowrap; overflow:hidden;}
        .progress-blue { background: #3b82f6; display:flex; justify-content:center; align-items:center; font-size:10px; color:white; font-weight:bold; white-space:nowrap; overflow:hidden;}

        .trip-pills-container { display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .trip-pills-container::-webkit-scrollbar { height: 4px; }
        .trip-pills-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .trip-pill { min-width: 95px; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; text-align: center; }
        .trip-pill.bg-green { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: #10b981; }
        .trip-pill.bg-blue { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.4); color: #60a5fa; }
        
        .trips-stacked { height: 22px; border-radius: 6px; }
        .trip-segment { display:flex; justify-content:center; align-items:center; font-size:11px; color:white; font-weight:bold; border-right: 1px solid rgba(255,255,255,0.3); white-space:nowrap; overflow:hidden; cursor:pointer; transition: opacity 0.2s;}
        .trip-segment:hover { opacity: 0.8; }
        .trip-segment:last-child { border-right: none; }

        #last-update { font-size: 12px; color: #64748b; text-align: right; margin-top: 10px; }

        @media (max-width: 768px) {
            .stat-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><span class="blinking-dot"></span> LIVE Monitor</h1>
        <a href="{% url 'backoffice:home' %}" class="btn-back">⬅️ ออก</a>
    </div>

    <!-- กล่องตัวเลข -->
    <div class="stat-grid">
        <div class="stat-card c-pending">
            <h3>⏳ ออเดอร์กำลังทำ (ค้าง)</h3>
            <div class="num" id="val-pending">0</div>
        </div>
        <div class="stat-card c-delivering">
            <h3>🛵 ไรเดอร์กำลังไปส่ง</h3>
            <div class="num" id="val-delivering">0</div>
        </div>
        <div class="stat-card c-completed">
            <h3>✅ ส่งสำเร็จแล้ว (วันนี้)</h3>
            <div class="num" id="val-completed">0</div>
        </div>
    </div>

    <div class="boards-wrapper">
        <!-- บอร์ด 1: ออเดอร์รอทำ (Pending) -->
        <div class="board-container" style="border-top: 4px solid #f59e0b;">
            <div class="board-title title-orange">🍳 รอครัว / รอไรเดอร์มารับ</div>
            <div id="preparing-container">
                <div style="text-align: center; color: #64748b; padding: 40px;">⏳ กำลังเชื่อมต่อข้อมูล...</div>
            </div>
        </div>

        <!-- บอร์ด 2: ออเดอร์กำลังทยอยส่ง (Delivering) + Rider Stats -->
        <div class="board-container" style="border-top: 4px solid #3b82f6;">
            <div class="board-title title-blue">🛵 ออเดอร์ที่กำลังทยอยส่ง</div>
            <div id="rider-stats-container" style="margin-bottom: 20px;"></div>
            <div id="delivering-container"></div>
        </div>
    </div>
    
    <!-- 🌟 โซนใหม่: บอร์ดจัดส่งสำเร็จ (แยกกระดานตามร้าน) 🌟 -->
    <div style="margin-top: 30px; margin-bottom: 15px; border-bottom: 2px dashed #334155; padding-bottom: 10px;">
        <h2 style="margin: 0; color: #10b981; font-size: 18px; display: flex; align-items: center; gap: 8px;">
            ✅ ออเดอร์ที่จัดส่งสำเร็จแล้ว (แยกตามร้านค้า)
        </h2>
    </div>
    
    <!-- กล่องสำหรับห่อหุ้มบอร์ดย่อยของแต่ละร้าน -->
    <div class="boards-wrapper" id="completed-boards-wrapper">
        <!-- บอร์ดของแต่ละร้านจะถูกสร้างตรงนี้อัตโนมัติด้วย Javascript -->
    </div>
    
    <div id="last-update">อัปเดตล่าสุด: -</div>

    <script>
        let allCompletedOrders = [];

        // ฟังก์ชันแปลงนาทีเป็น "X ชม. Y นาที"
        function formatDuration(minutes) {
            if (minutes === '-' || isNaN(minutes)) return minutes;
            let mins = parseInt(minutes);
            if (mins >= 60) {
                let h = Math.floor(mins / 60);
                let m = mins % 60;
                return m > 0 ? `${h} ชม. ${m} นาที` : `${h} ชม.`;
            }
            return `${mins} นาที`;
        }

        function groupBy(array, key) {
            return array.reduce((result, obj) => {
                (result[obj[key]] = result[obj[key]] || []).push(obj);
                return result;
            }, {});
        }

        // 1. กระดานรออาหาร (Pending)
        function renderPreparingOrders(orders) {
            const container = document.getElementById('preparing-container');
            if (orders.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: #475569; padding: 20px; font-size: 14px;">✨ ไม่มีออเดอร์ค้างในครัว</div>`;
                return;
            }

            const grouped = groupBy(orders, 'shop');
            let html = '';

            for (const shop in grouped) {
                html += `<div class="shop-group">
                            <h3 class="shop-group-title"><span style="font-size:20px;">🏪</span> ${shop} <span style="font-size:12px; color:#64748b; font-weight:normal;">(${grouped[shop].length} คิว)</span></h3>
                            <div class="order-list">`;
                
                grouped[shop].forEach(order => {
                    let itemsHtml = order.items.map(item => `<li>${item}</li>`).join('');
                    html += `
                        <div class="order-card" style="border-left: 4px solid #f59e0b;">
                            <div class="order-header-row">
                                <span class="order-receipt">#${order.receipt}</span>
                                <span class="live-timer" data-start="${order.created_at_iso}">⏳</span>
                            </div>
                            <div class="order-dest">📍 ปลายทาง: <strong style="color: white;">${order.dorm}</strong></div>
                            <div class="order-items-box">
                                <div style="color: #94a3b8; margin-bottom: 4px; font-weight: bold;">📝 รายการอาหาร:</div>
                                <ul>${itemsHtml}</ul>
                            </div>
                            <div class="order-footer"><span>เวลาสั่ง: ${order.time} น.</span></div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            container.innerHTML = html;
        }

        // 2. กระดานกำลังส่ง (Delivering) + สถิติไรเดอร์
        function renderDeliveringOrders(orders, riderStats) {
            const statsContainer = document.getElementById('rider-stats-container');
            let statsHtml = '';
            
            if (riderStats.length > 0) {
                statsHtml += `<h4 style="color: #cbd5e1; margin: 0 0 10px 0; font-size: 14px; border-bottom: 1px dashed #334155; padding-bottom: 8px;">📊 วิเคราะห์ประสิทธิภาพไรเดอร์</h4>`;
                
                riderStats.forEach(rider => {
                    const total = rider.completed + rider.delivering;
                    if(total === 0) return;
                    
                    const compPct = (rider.completed / total) * 100;
                    const delivPct = (rider.delivering / total) * 100;

                    let orderStackHtml = `
                        <div style="font-size: 11px; margin-bottom: 4px; color: #cbd5e1; display:flex; justify-content:space-between;">
                            <span>📦 สัดส่วนออเดอร์</span>
                            <span style="color:#38bdf8; font-weight:bold;">วันนี้ส่งรวม ${total} บิล</span>
                        </div>
                        <div class="progress-stacked" title="สีเขียว: สำเร็จแล้ว | สีฟ้า: กำลังวิ่งอยู่">
                            <div class="progress-green" style="width: ${compPct}%" title="สำเร็จ ${rider.completed} บิล">${rider.completed > 0 ? rider.completed + ' สำเร็จ' : ''}</div>
                            <div class="progress-blue" style="width: ${delivPct}%" title="กำลังส่ง ${rider.delivering} บิล">${rider.delivering > 0 ? rider.delivering + ' กำลังส่ง' : ''}</div>
                        </div>
                    `;

                    let validTrips = rider.trips.filter(t => t.duration !== '-');
                    let totalDuration = validTrips.reduce((sum, t) => sum + parseInt(t.duration), 0);
                    
                    let tripsStackHtml = '';
                    if(validTrips.length > 0) {
                        const timeColors = ['#8b5cf6', '#ec4899', '#f59e0b', '#3b82f6', '#f43f5e', '#10b981']; 
                        
                        let tripSegments = validTrips.map((t, idx) => {
                            let w = (parseInt(t.duration) / totalDuration) * 100;
                            if(w < 10) w = 10;
                            let color = timeColors[idx % timeColors.length];
                            
                            return `<div class="trip-segment" style="width: ${w}%; background-color: ${color};" title="รอบที่ ${t.trip} (${t.orders} บิล): ใช้เวลา ${formatDuration(t.duration)}">
                                        R${t.trip}
                                    </div>`;
                        }).join('');
                        
                        tripsStackHtml = `
                            <div style="font-size: 11px; margin-bottom: 4px; color: #cbd5e1; margin-top: 15px; display:flex; justify-content:space-between;">
                                <span>⏱️ สัดส่วนเวลาวิ่ง (แต่ละรอบ)</span>
                                <span style="color:#a855f7; font-weight:bold;">วิ่งไปแล้วรวม ${formatDuration(totalDuration)}</span>
                            </div>
                            <div class="progress-stacked trips-stacked" style="height: 22px;">
                                ${tripSegments}
                            </div>
                        `;
                    }

                    let tripPillsHtml = rider.trips.map(t => {
                        let colorClass = t.status === 'COMPLETED' ? 'bg-green' : 'bg-blue';
                        let icon = t.status === 'COMPLETED' ? '✅' : '🛵';
                        return `<div class="trip-pill ${colorClass}">
                                    <div style="font-size:10px; opacity:0.8;">รอบที่ ${t.trip} (${t.orders} บิล)</div>
                                    <div style="font-weight:bold; font-size:13px; margin-top:2px;">${icon} ${formatDuration(t.duration)}</div>
                                </div>`;
                    }).join('');

                    statsHtml += `
                        <div class="rider-stat-box">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #e2e8f0; font-size: 15px; font-weight: bold;">
                                <span>🛵 ${rider.name}</span>
                            </div>
                            ${orderStackHtml}
                            ${tripsStackHtml}
                            <div style="font-size: 11px; margin: 15px 0 6px 0; color: #cbd5e1;">📌 สรุปเวลาวิ่งแบบเจาะจง:</div>
                            <div class="trip-pills-container">
                                ${tripPillsHtml || '<span style="color:#64748b; font-size:11px;">ยังไม่มีการเริ่มรอบจัดส่ง</span>'}
                            </div>
                        </div>
                    `;
                });
            }
            statsContainer.innerHTML = statsHtml;

            const container = document.getElementById('delivering-container');
            if (orders.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: #475569; padding: 20px; font-size: 14px;">ตอนนี้ไม่มีไรเดอร์กำลังวิ่งงาน</div>`;
                return;
            }

            const grouped = groupBy(orders, 'shop');
            let html = '';
            for (const shop in grouped) {
                html += `<div class="shop-group">
                            <h3 class="shop-group-title"><span style="font-size:20px;">🏪</span> ${shop} <span style="font-size:12px; color:#64748b; font-weight:normal;">(กำลังส่ง ${grouped[shop].length} บิล)</span></h3>
                            <div class="order-list">`;
                
                grouped[shop].forEach(order => {
                    let itemsHtml = order.items.map(item => `<li>${item}</li>`).join('');
                    html += `
                        <div class="order-card" style="border-left: 4px solid #3b82f6;">
                            <div class="order-header-row">
                                <span class="order-receipt">#${order.receipt}</span>
                                <span class="live-timer-delivery" data-start="${order.started_at_iso}">🛵</span>
                            </div>
                            <div class="order-dest">📍 ปลายทาง: <strong style="color: white;">${order.dorm}</strong></div>
                            <div class="order-items-box"><ul>${itemsHtml}</ul></div>
                            <div class="order-footer">
                                <span style="color:#60a5fa; font-weight:bold;">ไรเดอร์: ${order.rider}</span>
                                <span>เริ่มวิ่ง: ${order.start_time} น.</span>
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            container.innerHTML = html;
        }

        // 🌟 3. กระดานสำเร็จแล้ว (แยกบอร์ดของแต่ละร้านอัตโนมัติ) 🌟
        function renderCompletedOrders() {
            const wrapper = document.getElementById('completed-boards-wrapper');
            
            if (allCompletedOrders.length === 0) {
                wrapper.innerHTML = `
                    <div class="board-container" style="border-top: 4px solid #10b981; grid-column: 1 / -1;">
                        <div style="text-align: center; color: #475569; padding: 40px; font-size: 15px;">ยังไม่มีออเดอร์ที่จัดส่งสำเร็จในวันนี้</div>
                    </div>`;
                return;
            }

            const grouped = groupBy(allCompletedOrders, 'shop');
            let html = '';

            for (const shop in grouped) {
                let shopOrders = grouped[shop];
                let orderListHtml = '';
                
                shopOrders.forEach(order => {
                    let itemsHtml = order.items.map(item => `<li>${item}</li>`).join('');
                    orderListHtml += `
                        <div class="order-card" style="border-left: 4px solid #10b981; margin-bottom: 10px;">
                            <div class="order-header-row">
                                <span class="order-receipt">#${order.receipt}</span>
                                <strong style="color: #10b981;">฿${order.total.toFixed(2)}</strong>
                            </div>
                            <div class="order-dest">📍 ปลายทาง: <strong style="color: white;">${order.dorm}</strong></div>
                            <div class="order-items-box"><ul>${itemsHtml}</ul></div>
                            <div class="order-footer" style="margin-top:10px;">
                                <span>🛵 ไรเดอร์: <b style="color:white;">${order.rider}</b></span>
                                <span>เสร็จตอน: ${order.completed_time} น. (เวลา: ${formatDuration(order.duration)})</span>
                            </div>
                        </div>
                    `;
                });

                // สร้างบอร์ด (กระดาน) ใหม่สำหรับร้านค้านี้โดยเฉพาะ
                html += `
                    <div class="board-container" style="border-top: 4px solid #10b981;">
                        <div class="board-title title-green">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span style="font-size:20px;">🏪</span>
                                <span>${shop}</span>
                            </div>
                            <span style="font-size: 13px; color: #94a3b8; font-weight: normal; background:#162032; padding:4px 8px; border-radius:6px; border:1px solid #334155;">สำเร็จ ${shopOrders.length} บิล</span>
                        </div>
                        <div class="order-list">
                            ${orderListHtml}
                        </div>
                    </div>
                `;
            }
            wrapper.innerHTML = html;
        }

        // ฟังก์ชันอัปเดตตัวจับเวลาแบบวินาที
        function updateLiveTimers() {
            // จับเวลาสีส้ม
            document.querySelectorAll('.live-timer').forEach(el => {
                let startTimeStr = el.getAttribute('data-start');
                if (startTimeStr) {
                    let startDate = new Date(startTimeStr);
                    if (!isNaN(startDate)) {
                        let diffSeconds = Math.floor((new Date() - startDate) / 1000);
                        if (diffSeconds < 0) diffSeconds = 0;
                        
                        let h = Math.floor(diffSeconds / 3600);
                        let m = Math.floor((diffSeconds % 3600) / 60).toString().padStart(2, '0');
                        let s = (diffSeconds % 60).toString().padStart(2, '0');
                        
                        let timeDisplay = h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
                        
                        if (diffSeconds >= 1800) {
                            el.style.background = '#fef2f2'; el.style.color = '#ef4444'; el.style.borderColor = '#fca5a5';
                        } else if (diffSeconds >= 900) {
                            el.style.background = '#fffbeb'; el.style.color = '#d97706'; el.style.borderColor = '#fcd34d';
                        } else {
                            el.style.background = '#f0fdf4'; el.style.color = '#16a34a'; el.style.borderColor = '#bbf7d0';
                        }
                        el.innerText = `⏱️ ${timeDisplay}`;
                    }
                }
            });

            // จับเวลาสีฟ้า
            document.querySelectorAll('.live-timer-delivery').forEach(el => {
                let startTimeStr = el.getAttribute('data-start');
                if (startTimeStr && startTimeStr !== 'null') {
                    let startDate = new Date(startTimeStr);
                    if (!isNaN(startDate)) {
                        let diffSeconds = Math.floor((new Date() - startDate) / 1000);
                        if (diffSeconds < 0) diffSeconds = 0;
                        
                        let h = Math.floor(diffSeconds / 3600);
                        let m = Math.floor((diffSeconds % 3600) / 60).toString().padStart(2, '0');
                        let s = (diffSeconds % 60).toString().padStart(2, '0');
                        
                        let timeDisplay = h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
                        
                        el.style.background = 'rgba(59, 130, 246, 0.1)'; 
                        el.style.color = '#60a5fa'; 
                        el.style.borderColor = 'rgba(59, 130, 246, 0.4)';
                        el.innerText = `🛵 วิ่งมาแล้ว ${timeDisplay}`;
                    }
                }
            });
        }
        setInterval(updateLiveTimers, 1000);

        // ดึงข้อมูล API หลัก
        function fetchLiveMonitor() {
            fetch("{% url 'backoffice:api_live_monitor' %}")
                .then(response => response.json())
                .then(data => {
                    document.getElementById('val-pending').innerText = data.pending_count;
                    document.getElementById('val-delivering').innerText = data.delivering_count;
                    document.getElementById('val-completed').innerText = data.completed_count;

                    renderPreparingOrders(data.preparing_orders);
                    renderDeliveringOrders(data.delivering_orders, data.rider_stats);

                    allCompletedOrders = data.completed_orders;
                    
                    // เรียกรันฟังก์ชันวาดบอร์ดสำเร็จแบบแยกตามร้าน
                    renderCompletedOrders();

                    const now = new Date();
                    document.getElementById('last-update').innerText = `อัปเดตล่าสุด: ${now.toLocaleTimeString()}`;
                })
                .catch(error => console.error("Error fetching live monitor:", error));
        }

        fetchLiveMonitor();
        setInterval(fetchLiveMonitor, 5000); 
    </script>
</body>
</html>
