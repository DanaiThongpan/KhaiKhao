{% load static %}

<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        เข้าสู่ระบบ | KhaiKhao POS
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

        }


        .container {

            width: 100%;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        .login-card {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(
                    0,
                    0,
                    0,
                    0.08
                );

        }


        .logo {

            text-align: center;

            margin-bottom: 30px;

        }


        .logo h1 {

            margin: 0;

            font-size: 28px;

            font-weight: 700;

        }


        .logo p {

            margin-top: 8px;

            color: #777;

            font-size: 14px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

        }


        .form-input {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid #ddd;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;

        }


        .form-input:focus {

            border-color: #222;

            box-shadow:
                0 0 0 2px
                rgba(
                    0,
                    0,
                    0,
                    0.05
                );

        }


        .message {

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 8px;

            background: #fee2e2;

            color: #b91c1c;

            font-size: 14px;

        }


        .success-message {

            background: #dcfce7;

            color: #166534;

        }


        .login-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #111;

            color: white;

            font-size: 15px;

            cursor: pointer;

        }


        .login-button:hover {

            background: #333;

        }


        .register-link {

            margin-top: 20px;

            text-align: center;

            font-size: 14px;

            color: #666;

        }


        .register-link a {

            color: #111;

            font-weight: 600;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="container">

    <div class="login-card">


        <!-- ==================================================
             Header
        =================================================== -->

        <div class="logo">

            <h1>
                KhaiKhao POS
            </h1>

            <p>
                เข้าสู่ระบบจัดการร้านค้า
            </p>

        </div>


        <!-- ==================================================
             Messages
        =================================================== -->

        {% if messages %}

            {% for message in messages %}

                <div
                    class="
                        message
                        {% if message.tags == 'success' %}
                            success-message
                        {% endif %}
                    "
                >

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <!-- ==================================================
             Login Form
        =================================================== -->

        <form
            method="POST"
        >

            {% csrf_token %}


            <!-- Username -->

            <div class="form-group">

                <label for="username">

                    ชื่อผู้ใช้

                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-input"
                    placeholder="กรอกชื่อผู้ใช้"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">

                    รหัสผ่าน

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="กรอกรหัสผ่าน"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="login-button"
            >

                เข้าสู่ระบบ

            </button>

        </form>


        <!-- ==================================================
             Register
        =================================================== -->

        <div class="register-link">

            ยังไม่มีบัญชี?

            <a href="{% url 'register' %}">
                สมัครสมาชิก
            </a>

        </div>


    </div>

</div>


</body>

</html>
